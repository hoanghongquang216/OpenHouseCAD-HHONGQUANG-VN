name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  preflight:
    name: Preflight (syntax + doctor)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell syntax check
        run: |
          shopt -s nullglob
          files=(scripts/*.sh scripts/lib/*.sh)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No shell scripts found, skipping syntax check"
            exit 0
          fi
          status=0
          for f in "${files[@]}"; do
            echo "bash -n $f"
            bash -n "$f" || status=1
          done
          exit "$status"

      - name: Environment doctor
        run: ./scripts/doctor.sh

  build-and-test:
    name: Build & Test (${{ matrix.compiler }}, ${{ matrix.build_type }})
    needs: preflight
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select compiler (GCC)
        if: matrix.compiler == 'gcc'
        run: |
          echo "CC=gcc-13" >> "$GITHUB_ENV"
          echo "CXX=g++-13" >> "$GITHUB_ENV"
          echo "EXTRA_CMAKE_ARGS=" >> "$GITHUB_ENV"

      # APP-002: Qt6 install + OPENHOUSE_BUILD_APP=ON, restricted to one
      # representative leg (gcc/Release) rather than the full matrix.
      # Rationale: APP-001's scope is toolchain verification only, not
      # compiler-compatibility verification -- no evidence yet justifies
      # the cost of building the (still near-empty) app module on every
      # leg. Revisit once the app layer contains substantial Qt-dependent
      # implementation (e.g. QRhiWidget viewport, docking, property UI).
      - name: Install Qt6 (representative leg only)
        if: matrix.compiler == 'gcc' && matrix.build_type == 'Release'
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev

      # gcc-13's libstdc++ builds std::expected fine when compiled by GCC
      # itself (see build-and-test gcc legs, which pass), but Clang-18
      # against that same libstdc++ fails with "no member named 'expected'
      # in namespace std" -- libstdc++'s <expected> gates its contents on
      # feature-test macros that Clang-18 doesn't satisfy the same way GCC
      # does. This is a known Clang+libstdc++ gap, not a project bug.
      # Fix: build the clang leg against libc++ instead, which has shipped
      # a complete std::expected since LLVM 16.
      - name: Select compiler (Clang)
        if: matrix.compiler == 'clang'
        run: |
          sudo apt-get update
          sudo apt-get install -y libc++-18-dev libc++abi-18-dev
          echo "CC=clang-18" >> "$GITHUB_ENV"
          echo "CXX=clang++-18" >> "$GITHUB_ENV"
          echo "EXTRA_CMAKE_ARGS=-DCMAKE_CXX_FLAGS=-stdlib=libc++ -DCMAKE_EXE_LINKER_FLAGS=-stdlib=libc++" >> "$GITHUB_ENV"

      - name: Ensure CMake >= 3.25
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "3.28.0"

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DOPENHOUSE_WARNINGS_AS_ERRORS=ON
          -DBUILD_TESTING=ON
          -DOPENHOUSE_BUILD_APP=${{ (matrix.compiler == 'gcc' && matrix.build_type == 'Release') && 'ON' || 'OFF' }}
          ${EXTRA_CMAKE_ARGS}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --parallel
