name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  preflight:
    name: Preflight (syntax + doctor)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell syntax check
        run: |
          shopt -s nullglob
          files=(scripts/*.sh scripts/lib/*.sh)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No shell scripts found, skipping syntax check"
            exit 0
          fi
          status=0
          for f in "${files[@]}"; do
            echo "bash -n $f"
            bash -n "$f" || status=1
          done
          exit "$status"

      - name: Environment doctor
        run: ./scripts/doctor.sh

  build-and-test:
    name: Build & Test (${{ matrix.compiler }}, ${{ matrix.build_type }})
    needs: preflight
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select compiler (GCC)
        if: matrix.compiler == 'gcc'
        run: |
          echo "CC=gcc-13" >> "$GITHUB_ENV"
          echo "CXX=g++-13" >> "$GITHUB_ENV"

      - name: Select compiler (Clang)
        if: matrix.compiler == 'clang'
        run: |
          echo "CC=clang-18" >> "$GITHUB_ENV"
          echo "CXX=clang++-18" >> "$GITHUB_ENV"

      - name: Ensure CMake >= 3.25
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "3.28.0"

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DOPENHOUSE_WARNINGS_AS_ERRORS=ON
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --parallel
