name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.compiler }}, ${{ matrix.build_type }})
    runs-on: ubuntu-24.04
    # gcc-13 and clang-18 are both preinstalled on the ubuntu-24.04 runner
    # image as of this writing (GNU C++ 13.3.0, Clang 18.1.3), so no
    # separate install step is needed for either. Verified via search,
    # not by actually running this workflow (see conversation history).
    #
    # Known risk, NOT resolved here: there are public reports of Clang on
    # ubuntu-24.04 runners failing to find C++ standard library headers
    # (a libstdc++/Clang compatibility issue on this specific runner
    # image, unrelated to this project's code). If the `clang` matrix leg
    # fails with header-not-found errors rather than a real code problem,
    # this is the likely cause -- investigate `-stdlib=` flags or an
    # explicit GCC toolchain hint for Clang before assuming the project's
    # C++ is at fault.
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select compiler (GCC)
        if: matrix.compiler == 'gcc'
        run: |
          echo "CC=gcc-13" >> "$GITHUB_ENV"
          echo "CXX=g++-13" >> "$GITHUB_ENV"

      - name: Select compiler (Clang)
        if: matrix.compiler == 'clang'
        run: |
          echo "CC=clang-18" >> "$GITHUB_ENV"
          echo "CXX=clang++-18" >> "$GITHUB_ENV"

      # ubuntu-24.04 runners ship a recent CMake, but pin explicitly so CI
      # doesn't silently drift out of sync with the >=3.25 requirement in
      # the project's CMakeLists.txt files.
      - name: Ensure CMake >= 3.25
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "3.28.0"

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DOPENHOUSE_WARNINGS_AS_ERRORS=ON
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --parallel
